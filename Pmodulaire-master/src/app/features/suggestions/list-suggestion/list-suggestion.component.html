<div class="page-wrapper">

    <app-header [count]="suggestions.length"></app-header>

    <div class="search-container">
        <div class="search-box">
            <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input type="text" class="search-input" placeholder="Rechercher par titre ou catégorie..."
                [(ngModel)]="searchTerm">
            <div class="search-badge" *ngIf="searchTerm">
                {{ filteredSuggestions.length }} résultat(s)
            </div>
        </div>
    </div>

    <div class="cards-grid">
        <div class="suggestion-card" *ngFor="let suggestion of filteredSuggestions; let i = index"
            [style.animation-delay]="i * 0.1 + 's'">
            <div class="card-status-bar" [ngClass]="'status-' + suggestion.status"></div>

            <div class="card-body">
                <div class="card-header">
                    <span class="category-badge">{{ suggestion.category }}</span>
                    <span class="status-badge" [ngClass]="'badge-' + suggestion.status">
                        <span class="badge-dot"></span>
                        {{ suggestion.status }}
                    </span>
                </div>

                <h2 class="suggestion-title">{{ suggestion.title }}</h2>
                <p class="suggestion-description">{{ suggestion.description }}</p>

                <div class="card-footer">
                    <div class="card-date">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" width="14" height="14">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                            <line x1="16" y1="2" x2="16" y2="6" />
                            <line x1="8" y1="2" x2="8" y2="6" />
                            <line x1="3" y1="10" x2="21" y2="10" />
                        </svg>
                        {{ suggestion.date | date:'dd MMM yyyy' }}
                    </div>

                    <div class="actions-group" *ngIf="suggestion.status !== 'refusee'">
                        <button class="like-btn" [class.liked]="suggestion.nbLikes > 0"
                            (click)="likeSuggestion(suggestion)">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M7 22V11" />
                                <path d="M2 11h5V22H2z" />
                                <path d="M17 22a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2h-3l1-4V4a2 2 0 0 0-2-2h-1l-5 9v11h8z" />
                            </svg>
                            <span>{{ suggestion.nbLikes }}</span>
                        </button>

                        <button class="favoris-btn" [class.favoris]="suggestion.isFavorite"
                            (click)="toggleFavorite(suggestion)">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                [attr.fill]="suggestion.isFavorite ? '#f87171' : 'none'" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
                            </svg>
                        </button>
                    </div>
                    <div class="view-details">
                        <a [routerLink]="['/suggestions/details', suggestion.id]">View Details</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="empty-state" *ngIf="filteredSuggestions.length === 0">
        <div class="empty-icon"></div>
        <p>Aucun résultat pour "{{ searchTerm }}".</p>
    </div>
    

    <app-footer></app-footer>

</div>
